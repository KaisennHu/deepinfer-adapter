[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "deepinfer-adapter"
version = "0.2.0"
description = "Connect DeepInfer to vLLM Router with HTTP prefill/decode disaggregation or gRPC workers"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "grpcio >= 1.60",
    "grpcio-health-checking >= 1.60",
    "protobuf >= 5",
]

[project.optional-dependencies]
pd = ["fastapi >= 0.115", "uvicorn >= 0.30", "tokenizers >= 0.21"]
dev = ["grpcio-tools >= 1.60", "httpx >= 0.27", "numpy", "torch", "pytest >= 8"]

[tool.setuptools.packages.find]
include = ["deepinfer_adapter*"]
